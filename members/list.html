<!doctype html>

    <main>
      <div class="search-box">
        <label for="search-input">Search Member Name</label>
        <input type="text" id="search-input" placeholder="Type a member name..." />
      </div>

      <p id="loading-indicator" style="display:none;">Loading data...</p>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Member No.</th>
              <th>Name</th>

              <th>Phone</th>

            </tr>
          </thead>
          <tbody>
            <!-- Rows are dynamically populated by assets/js/anggota.js via fetch('../data/anggota.json') -->
          </tbody>
        </table>
      </div>
    </main>

    <footer>
      <p>© 2026 SIMPUS-Mini - Jobsheet 1</p>
    </footer>

    <script src="../assets/js/app.js"></script>
        <script src="../assets/js/tabel.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        loadTable("../data/anggota.json", ["member_no", "name", "address", "phone"], false);
      });
    </script>
